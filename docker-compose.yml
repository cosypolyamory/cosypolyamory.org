volumes:
  cosypolyamory:
  proxy_conf:
  proxy_vhost:
  proxy_html:

services:

  web:
    build: .
    image: cosypolyamory-web
    restart: unless-stopped
    expose:
      - "3031"
    volumes:
      - cosypolyamory:/data
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST:-cosypolyamory.org}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-cosypolyamory.org}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-mayhem@gmail.com}
      - DATABASE_PATH=/data/cosypolyamory.db
      - UWSGI_PROCESSES=${UWSGI_PROCESSES:-8}
    command: ["/code/cosypolyamory.org/docker_startup.sh"]

  reminders:
    build: .
    image: cosypolyamory-reminders
    restart: unless-stopped
    volumes:
      - cosypolyamory:/data
    environment:
      - DATABASE_PATH=/data/cosypolyamory.db

    command: ["/code/cosypolyamory.org/send_event_reminders.py"]

  # Reverse proxy that terminates TLS and routes by Host header. Opt in with
  # `--profile proxy`, or set COMPOSE_PROFILES=proxy in .env to always include it.
  # Certificates are read from ./certs, named <hostname>.crt / <hostname>.key.
  # Add the acme-companion service below once the hostname resolves publicly
  # and inbound port 80 is open, to get certificates from Let's Encrypt.
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
      - proxy_conf:/etc/nginx/conf.d
      - proxy_vhost:/etc/nginx/vhost.d
      - proxy_html:/usr/share/nginx/html

networks:
  default:
    name: nginx-proxy
